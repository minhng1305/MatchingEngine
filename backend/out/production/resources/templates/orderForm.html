<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Platform - New Order</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

  <style>
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    .card-header {
      background-color: #f8f9fa;
      font-weight: bold;
    }
    .btn-primary {
      background-color: #0d6efd;
    }
    .navbar-brand {
      font-weight: 600;
    }
  </style>
</head>


<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fs-2" href="#">Green Trading</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header text-center py-3">
          <h2 class="mb-0 fs-3">Place New Order</h2>
        </div>
        <div class="card-body">
          <!-- CHANGE HERE: Updated the action attribute to match your endpoint -->
          <form id="orderForm" action="submitOrder" method="post">

            <input type="hidden" id="orderId" name="orderId">

            <!-- User ID field -->
            <div class="mb-3">
              <label for="userId" class="form-label">User ID</label>
              <input type="text" class="form-control" id="userId" name="userId" required>
            </div>

            <!-- Symbol field -->
            <div class="mb-3">
              <label for="symbol" class="form-label">Symbol</label>
              <select class="form-select" id="symbol" name="symbol" required>
                <option value="" disabled selected>Select a symbol</option>
                <option value="AAPL">AAPL</option>
                <option value="TSL">TSL</option>
                <option value="MS">MS</option>
              </select>
            </div>

            <!-- Order Type field -->
            <div class="mb-3">
              <label for="type" class="form-label">Order Type</label>
              <select class="form-select" id="type" name="type" required onchange="toggleLimitPrice()">
                <option value="" disabled selected>Select order type</option>
                <option value="MARKET">MARKET</option>
                <option value="LIMIT">LIMIT</option>
              </select>
            </div>

            <!-- Order Side field -->
            <div class="mb-3">
              <label for="side" class="form-label">Side</label>
              <select class="form-select" id="side" name="side" required>
                <option value="" disabled selected>Select order side</option>
                <option value="BUY">BUY</option>
                <option value="SELL">SELL</option>
              </select>
            </div>

            <!-- Price field (will be autofilled for market orders) -->
            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" required>
            </div>

            <!-- Limit Price field (conditionally visible) -->
            <div class="mb-3" id="limitPriceContainer">
              <label for="limitPrice" class="form-label">Limit Price</label>
              <input type="number" step="0.01" min="0" class="form-control" id="limitPrice" name="limitPrice">
            </div>

            <!-- Quantity field -->
            <div class="mb-3">
              <label for="quantity" class="form-label">Quantity</label>
              <input type="number" min="1" class="form-control" id="quantity" name="originalQuantity" required>
            </div>

            <!-- Hidden fields for auto-generated values -->
            <input type="hidden" id="status" name="status" value="PENDING">

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">Submit Order</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleLimitPrice() {
    const orderType = document.getElementById('type').value;
    const limitPriceContainer = document.getElementById('limitPriceContainer');
    const limitPriceInput = document.getElementById('limitPrice');

    if (orderType === 'MARKET') {
      limitPriceContainer.style.display = 'none';
      limitPriceInput.value = '0';
      limitPriceInput.required = false;
    } else {
      limitPriceContainer.style.display = 'block';
      limitPriceInput.required = true;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    toggleLimitPrice();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
