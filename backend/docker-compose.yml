version: "3.9"

services:
    # --- Application Instance 1 ---
    app-server1:
        build: .
        restart: on-failure
        depends_on:
            - kafka
            - postgres
        ports:
            - "8080:8080"
        environment:
            - SPRING_PROFILES_ACTIVE=server1
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MatchingEngine
            - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
            - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:9092
        networks:
            - my-network

    # --- Application Instance 2 ---
    app-server2:
        build: .
        restart: on-failure
        depends_on:
            - kafka
            - postgres
        ports:
            - "8081:8081"
        environment:
            - SPRING_PROFILES_ACTIVE=server2
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MatchingEngine
            - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
            - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:9092
        networks:
            - my-network

    # --- Application Instance 3 ---
    app-server3:
        build: .
        restart: on-failure
        depends_on:
            - kafka
            - postgres
        ports:
            - "8082:8082"
        environment:
            - SPRING_PROFILES_ACTIVE=server3
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MatchingEngine
            - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:9092
            - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:9092
        networks:
            - my-network

    # --- PostgreSQL Database ---
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: postgres # This must match your application.properties
            POSTGRES_PASSWORD: A@13052004b # This must match your application.properties
            POSTGRES_DB: MatchingEngine
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - my-network

    # --- Zookeeper (Required by Kafka) ---
    zookeeper:
        image: confluentinc/cp-zookeeper:latest
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        networks:
            - my-network

    # --- Kafka Broker ---
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        networks:
            - my-network

# --- Docker Volumes and Networks ---
volumes:
    postgres_data:

networks:
    my-network:
        driver: bridge