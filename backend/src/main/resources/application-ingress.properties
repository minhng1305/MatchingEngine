spring.application.name=matchingengine

# Ingress-specific overrides
# When used with production profile (production,ingress), only these overrides apply.
# When used standalone for local dev, env vars fall back to localhost defaults.

# Server Port
server.port=${PORT:8085}

# CORS Configuration
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Session Configuration
server.servlet.session.cookie.same-site=strict

# Kafka Producer Configuration (ingress only produces, never consumes)
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.producer.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.producer.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

# Kafka Topic Configuration
app.kafka.topic.orders=orders
app.kafka.dlq.topic=orders-dlq

# Jackson configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Database configuration (env vars for cloud, localhost fallback for local dev)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/MatchingEngine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.data-source-properties.stringtype=unspecified
spring.jpa.hibernate.ddl-auto=validate

# Disable Flyway (database schema is managed by matching servers)
spring.flyway.enabled=false

# Static Resources (disabled - frontend served by Vercel)
spring.web.resources.add-mappings=false

# JWT Configuration
jwt_secret=${JWT_SECRET:default-dev-secret}

