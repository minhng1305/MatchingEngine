spring.application.name=matchingengine

# Server Port
server.port=8081

# Session Configuration
server.servlet.session.cookie.same-site=strict

# Kafka Producer Configuration
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=matching-engine-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka Topic Configuration (NEW ARCHITECTURE)
# All servers subscribe to the same single topic "orders"
app.kafka.topic.orders=orders

# Consumer Concurrency
# Formula: concurrency = total_partitions / number_of_servers
# Example: 12 partitions / 3 servers = 4 threads per server
app.kafka.consumer.concurrency=4

# Dead Letter Queue Configuration
app.kafka.dlq.topic=orders-dlq

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/,file:frontend/build/
spring.web.resources.add-mappings=true

# Jackson configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Flyway configuration
spring.flyway.locations=classpath:/db/migration
spring.flyway.schemas=employee
spring.flyway.baselineOnMigrate=true
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Import external secrets from secrets folder (outside backend directory)
# For production, consider using environment variables or absolute paths
spring.config.import=file:../secrets/secrets.properties

# Database configuration
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/MatchingEngine
spring.datasource.username=postgres
# Password is loaded from external secrets file
# spring.datasource.password is defined in ../secrets/secrets.properties

# HikariCP Connection Pool Configuration (for async database operations)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JWT configuration
# JWT secret is loaded from external secrets file
# jwt_secret is defined in ../secrets/secrets.properties

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis password is loaded from external secrets file (if applicable)
# spring.data.redis.password is defined in ../secrets/secrets.properties
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
