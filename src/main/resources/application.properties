spring.application.name=matchingengine

# Redis Configuration
# spring.redis.host=localhost
# spring.redis.port=6379
# spring.cache.type=redis
# spring.cache.redis.time-to-live=3600000


# Kafka Producer Configuration
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# spring.kafka.producer.properties.spring.json.add.type.headers=false # Prevents adding __TypeId__ header, useful for simple JSON

# # Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=matching-engine-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# spring.kafka.consumer.properties.spring.json.trusted.packages=* # Trust all packages for deserialization
# spring.kafka.consumer.auto-offset-reset=earliest # Start reading from the beginning if no offset is found

# # Define Kafka Topics
app.kafka.topics.order-submission=order-submission-topic
app.kafka.topics.trade-execution=trade-execution-topic
app.kafka.topics.market-data-updates=market-data-updates-topic
app.kafka.topics.test=test-topic


# Server Port
server.port=8080