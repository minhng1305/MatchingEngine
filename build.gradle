plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java-library'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		 
	}
}

repositories {
	mavenCentral()
}

dependencies {
	api 'org.apache.httpcomponents:httpclient:4.5.7'

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter'

	// JUnit 5 (Jupiter) dependencies
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.1'

	// Lettuce (Redis)
	compileOnly 'io.lettuce:lettuce-core:6.6.0.RELEASE'
	implementation 'io.lettuce:lettuce-core:6.6.0.RELEASE'

	// Spring Data Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Kafka dependencies
	implementation 'org.springframework.kafka:spring-kafka'

	testImplementation 'org.assertj:assertj-core:3.17.2'
	testImplementation "org.mockito:mockito-core:5.+"

	// Spring Boot WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework:spring-messaging'
    implementation 'org.springframework:spring-websocket'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Security dependencies
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// implementation 'org.springframework.boot:spring-boot-starter-security'

	// implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'
	// testImplementation 'org.springframework.security:spring-security-test'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Database dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// H2 Database for testing
	testImplementation 'com.h2database:h2'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	}


tasks.named('test') {
	useJUnitPlatform()
}

task runClass(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = project.hasProperty('mainClass') ? project.getProperty('mainClass') : 'com.project.matchingengine.Application'
}

// Enable preview features for Java 24
tasks.withType(Test) {
    jvmArgs += ['--enable-preview']
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['--enable-preview']
}

// Add JVM arguments for module access
tasks.withType(Test) {
    jvmArgs += [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-exports=java.base/sun.reflect.annotation=ALL-UNNAMED'
    ]
}